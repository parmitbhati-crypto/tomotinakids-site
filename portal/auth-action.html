<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Continue Securely | Tomotina Kids</title>
  <link rel="stylesheet" href="/assets/css/portal.css">
</head>
<body class="portal-login-page">
<main class="portal-login-layout">
  <section class="portal-login-story">
    <img src="/assets/images/logo.png" alt="Tomotina Kids">
    <div><span class="portal-login-kicker">Secure account action</span><h1>Continue when you are ready.</h1><p>This extra confirmation protects one-time account links from email-security scanners.</p></div>
    <small>Tomotina Kids staff portal</small>
  </section>
  <section class="portal-login-panel">
    <div class="portal-login-card">
      <div><h2 id="actionTitle">Continue securely</h2><p id="actionCopy">Press Continue to open your one-time secure link.</p></div>
      <div id="actionMessage" class="msg" hidden role="status"></div>
      <button id="continueAction" class="btn primary" type="button">Continue</button>
      <a class="btn" href="/portal/login.html">Back to sign in</a>
    </div>
  </section>
</main>
<script src="/assets/js/env.js"></script>
<script src="/assets/js/auth-action.js"></script>
</body>
</html>
