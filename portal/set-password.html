<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set Password | Tomotina Kids</title><link rel="stylesheet" href="/assets/css/portal.css"></head>
<body class="portal-login-page">
<main class="portal-login-layout">
  <section class="portal-login-story"><img src="/assets/images/logo.png" alt="Tomotina Kids"><div><span class="portal-login-kicker">Welcome to the team</span><h1>Create your secure password.</h1><p>Your account gives you access to assigned programs, schedules, attendance, and session workflows.</p></div><small>Tomotina Kids staff portal</small></section>
  <section class="portal-login-panel"><form id="setPasswordForm" class="portal-login-card"><div><h2>Set your password</h2><p>Use at least 10 characters with a mix of letters and numbers.</p></div><div id="passwordMessage" class="msg" hidden role="status"></div><label>Password<input name="password" type="password" minlength="10" required autocomplete="new-password"></label><label>Confirm password<input name="confirmPassword" type="password" minlength="10" required autocomplete="new-password"></label><button class="btn primary" type="submit">Save password &amp; continue</button></form></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script><script src="/assets/js/env.js"></script><script src="/assets/js/supabaseClient.js"></script><script src="/assets/js/set-password.js"></script>
</body></html>
