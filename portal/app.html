<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Opening Portal | Tomotina Kids</title>
  <link rel="stylesheet" href="/assets/css/portal.css">
</head>
<body>
  <main class="container">
    <div class="portal-state" aria-live="polite">Opening your workspace…</div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
  <script src="/assets/js/env.js"></script>
  <script src="/assets/js/supabaseClient.js"></script>
  <script>
    (async () => {
      const { data } = await window.sb.auth.getUser();
      if (!data?.user) {
        window.location.replace('/portal/login.html');
        return;
      }
      const { data: access } = await window.sb.rpc('get_portal_access_state').maybeSingle();
      if (access?.account_is_active === false) {
        await window.sb.auth.signOut();
        window.location.replace('/portal/login.html?status=inactive');
      } else if (access?.portal_role === 'admin') {
        const { data: assurance } = await window.sb.auth.mfa.getAuthenticatorAssuranceLevel();
        if (assurance?.currentLevel === 'aal2') {
          window.location.replace('/portal/admin-home.html');
        } else {
          const { data: factors } = await window.sb.auth.mfa.listFactors();
          const verified = (factors?.totp || []).some((factor) => factor.status === 'verified');
          window.location.replace(verified ? '/portal/mfa-challenge.html' : '/portal/mfa-setup.html');
        }
      } else if (access?.portal_role === 'teacher') {
        window.location.replace('/portal/day.html');
      } else {
        await window.sb.auth.signOut();
        window.location.replace('/portal/login.html?status=pending');
      }
    })();
  </script>
</body>
</html>
