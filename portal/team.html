<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team Directory | Tomotina Kids</title><link rel="stylesheet" href="/assets/css/portal.css"></head>
<body>
<main class="container">
  <div class="portal-header">
    <div><p class="portal-eyebrow">People and access</p><h2 class="portal-title">Team Directory</h2><p class="portal-subtitle">Manage teachers, program access, invitation progress, and availability.</p></div>
    <div class="portal-actions"><a class="btn primary" href="/portal/team-new.html">Invite team member</a></div>
  </div>
  <section class="card">
    <div id="teamMessage" class="msg" data-type="info" hidden role="status"></div>
    <div class="toolbar">
      <label class="field"><span>Search</span><input id="teamSearch" type="search" placeholder="Name, email, designation"></label>
      <label class="field"><span>Status</span><select id="teamStatus"><option value="all">All team members</option><option value="active">Active</option><option value="inactive">Inactive</option><option value="invited">Invitation pending</option></select></label>
      <button class="btn" id="refreshTeam" type="button">Refresh</button>
    </div>
    <div class="team-summary" id="teamSummary" aria-live="polite"></div>
    <div id="teamList" class="team-directory"><div class="portal-state">Loading team directory…</div></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script><script src="/assets/js/env.js"></script><script src="/assets/js/supabaseClient.js"></script><script src="/assets/js/auth.js"></script><script src="/assets/js/team.js"></script>
</body></html>
